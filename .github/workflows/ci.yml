# CI (INSTRUCTIONS §12, ROADMAP M1.1). Runs once the GitHub remote exists (D-015).
# Every job goes through the same root npm scripts as local work (INSTRUCTIONS §14).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run rs:lint
      - run: npm run rs:test
      - run: npm run rs:wasm
      - name: wasm-bindgen version from Cargo.lock (the CLI must match it, D-008)
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          echo "WASM_BINDGEN=$v" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ env.WASM_BINDGEN }}
      - name: wasm-bindgen-cli
        run: command -v wasm-bindgen || cargo install wasm-bindgen-cli --version "=$WASM_BINDGEN" --locked
      - name: Native vs WASM hashes (INSTRUCTIONS §4)
        run: npm run wasm:check
      - name: Lockstep smoke test (two headless players through the relay, M3.5)
        run: |
          npm ci
          npm run relay:lint
          npm run test -w relay
      - name: WASM package for the client job
        uses: actions/upload-artifact@v4
        with:
          name: sim-wasm-pkg
          path: sim-wasm/pkg

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run py:sync
      - run: npm run py:lint
      - run: npm run py:test

  client:
    needs: rust # the live match imports the sim-wasm package built there
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sim-wasm-pkg
          path: sim-wasm/pkg
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run client:lint
      - run: npm run client:check
      - run: npm run client:test
      - name: Build (the menu shows the commit and date; feedback link from the repo variable)
        run: VITE_BUILD="$(git rev-parse --short HEAD) · $(date -u +%Y-%m-%d)" npm run client:build
        env:
          VITE_FEEDBACK_URL: ${{ vars.FEEDBACK_URL }}
      # Static deploy (M5a 9, D-157): main only, once the repository variable
      # CLOUDFLARE_PAGES_PROJECT and the secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID exist.
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PAGES_PROJECT != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy client/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
