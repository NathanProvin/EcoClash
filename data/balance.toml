# Economy (gamerules §4, §7; D-018, D-023). Placeholder values, not tuned (prototype).
# Biomass points are a bank separate from the fields. Tier 1 of level 1 (pioneers, earthworms) is
# unlocked at start; each other card needs the previous tier of its level.
[economy]
start_budget = 1000
income_rate = 0.001          # points per unit of flora growth (animals add their energy gain)
unlock_flora = [200, 1500, 5000]            # base unlock cost per flora level L1..L3
unlock_fauna = [200, 1000, 2000, 4000, 8000]  # base unlock cost per fauna level F1..F5
tier_multiplier = 1.5        # unlock cost = base x tier_multiplier^(tier - 1) (§4.4)
plant_cost = [20, 60, 150]   # points per cell planted, per flora level
spawn_cost_per_body = 1.0    # points per unit of body per animal spawned
drop_surcharge = 1.5         # predators dropped outside own land cost more (§6.3)
