# Fauna agents (gamerules §5.2, §6; D-023). level / tier: position in the tech tree (F1..F5). Placeholder values, not tuned (prototype).
# Energy is in biomass units. Rates are per second; speed and sight are in cells (speed per flora
# tick). role: decomposer (eats dead biomass), herbivore (eats flora), predator (eats animals).
# eats / habitat list flora names, "L1".."L3" (every species of that level) or, for predators,
# fauna names. small = can hide in a refuge. group = animals per spawned card.
[fauna]
transfer = 0.1          # share of eaten biomass that becomes the eater's energy (10 % rule)
own_graze = 0.2         # bite on own flora, relative to enemy flora (gamerules §10)
soil_per_dead = 0.5     # soil development (u16 units) per unit of dead biomass decomposed
herbivore_range = 10    # spawn trigger: enemy food within this many cells of own land (§6.3)
flee_radius = 3         # prey flee enemy hunters closer than this
refuge_flora = ["hawthorn", "bramble"]
refuge_cover = 0.5      # summed cover of refuge flora that hides small fauna (D-023)

[fauna.earthworms]
level = 1
tier = 1
role = "decomposer"
eats = ["dead"]
habitat = ["L1"]
small = true
body = 50
bite = 15
upkeep = 0.01
speed = 1
sight = 4
group = 10

