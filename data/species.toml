# species.toml — per-species stats (D-029, D-087). Tune freely; values are placeholders for M7.
# Loaded together with balance.toml (both are converted and hashed together, D-011).
#
# Stats (first block of each species):
#   growth       plants: colonization gauge speed at full pressure (1/s)
#                animals: minimum seconds between two births of a well-fed animal
#   spawn_cost   plants: points per cell planted; animals: points per animal
#   unlock_cost  points to unlock the species card (0 = available at start)
#   yield        points per second: per fully covered cell (plants), per animal (animals)
#   cap          plants: share of the map's cells per player (0..1, D-045)
#   per_cell     animals: carrying capacity, animals per own cell holding their habitat (D-246)
#   effect       special effect, shown in the UI
#
# Tech tree (D-087): family = the build-bar group, tier = small (1), medium (2), large (3). A card
#   needs a card of the previous tier of its family. Plant families: L1 herbaceous, L2 intermediate,
#   L3 shrubs, L4 trees, W aquatic. Animal families: D detritivores, H1..H4 eaters of L1..L4,
#   HW aquatic grazers, P1 insect eaters, P2 small-mammal eaters, P3 large-mammal eaters,
#   PW aquatic hunters, S superpredators (D-187, D-197). Grazers (H1..H4, HW) list no diet or
#   habitat: they eat and live on their family's layer (L1..L4, W; D-244), harder with tier
#   ([fauna] tier_damage). Hunters' and recyclers' habitat entries are species or family names;
#   their diets (`eats`) are species in rank order, primary first, at most three (D-122);
#   recyclers eat "dead".
#
# Model (second block):
#   Plants: level = height stratum 1..4 (competition acts within a stratum; no shade, D-243);
#   water_optimum / water_tolerance = moisture response (0..1; growth falls to 0 at optimum +/-
#   tolerance; slow in the shallows, D-084; aquatic plants want the water; D-239: each layer has
#   dry-ground species, e.g. lichen, hawthorn, chestnut, and moist ones, e.g. ferns, nettle, elder,
#   beech); biomass_rate = logistic r (1/s); k_max = biomass capacity of a cell (u16);
#   bedrock = favourite rock type, growth x (1 + [flora] bedrock_boost) on it (D-240);
#   soil_gain = soil development per second at full cover (D-237: slow, a lichen + grass cell
#   alone builds full soil in about 28 min; recyclers speed it up).
#   Animals: role, eats, habitat, small = can hide in a refuge, swarm = drawn as a swarm, not a
#   unit (D-065), body (energy capacity), bite (1/s), upkeep (share of body per s), speed and
#   sight (cells: food, prey and room search), vision (cells revealed in the fog, D-255; swimmers
#   reveal water only), group (animals per spawned card), medium = walk, swim, amphibious or fly (D-084).
#   Movement (D-088): wobble / wobble_keep = drift kick (share of speed) and drift kept per tick,
#   defaulting to [fauna]; rest = chance to stay put at an idle decision (stop-and-go).

