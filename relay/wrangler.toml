# The deployed lockstep relay (D-219): a Worker + one Durable Object per room code.
name = "ecoclash-relay"
main = "worker.mjs"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"] # SQLite-backed: available on the free plan

# balance.toml is read as text for the [net] rules.
[[rules]]
type = "Text"
globs = ["**/*.toml"]
fallthrough = true
