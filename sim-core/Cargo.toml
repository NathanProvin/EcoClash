[package]
name = "sim-core"
description = "EcoClash deterministic simulation: integer / fixed-point only, no rendering, no I/O"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.6", features = ["preserve_order"] }
xxhash-rust = { version = "0.8.19", features = ["xxh64"] }

[dev-dependencies]
serde_json = "1.0.151"
