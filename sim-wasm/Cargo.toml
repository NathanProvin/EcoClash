[package]
name = "sim-wasm"
description = "EcoClash simulation for the browser (Web Worker) and Node: wasm-bindgen wrapper over sim-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
serde_json = "1.0.151"
sim-ai = { path = "../sim-ai" }
sim-core = { path = "../sim-core" }
wasm-bindgen = "=0.2.129" # the wasm-bindgen-cli version must match exactly (D-008)
