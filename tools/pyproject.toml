# Python tooling (INSTRUCTIONS §9). Run everything through `uv run` / root `npm run py:*`.
[project]
name = "ecoclash-tools"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.2",
    "scipy>=1.15",
    "matplotlib>=3.10",
    "ipykernel>=6.29", # notebooks in VS Code / Jupyter
]

[dependency-groups]
dev = ["ruff>=0.12", "pytest>=8.4"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
